# Schema migrations
# Reading, queueing, approving and running schema migrations.
#
# Surface:   migrations
# Qualifier: none (the surface has no qualifier)
# Actions:   read, run, queue, approve, reject
#
# This file holds two YAML documents. The first is a policy bundle: named rules
# with approvals and step-up proof, referenced from policy.migrations. The second is an
# IAM policy: the principal-bound ceiling, limited to `when` and `action: allow|deny`.
# The ceiling is evaluated first; the bundle can only narrow it.

rules:
  - name: migrations-readers
    when:
      contains: [subject.roles, "PROJECT_ADMIN"]
    action: allow
  - name: migrations-writers
    when:
      contains: [subject.roles, "PROJECT_ADMIN"]
    action: allow
  - name: migrations-admin-with-fresh-proof
    when:
      contains: [subject.roles, "PROJECT_ADMIN"]
    action: allow
    requires_proof: { max_age: "5m", min_tier: T3_KEY_POSSESSION, single_use: true }
  - name: migrations-needs-second-admin
    when: true
    requires_approval_from: { role: PROJECT_ADMIN }
    expires_after: P2D

policy:
  migrations:
    actions:
      read:
        - migrations-readers
      run:
        - migrations-admin-with-fresh-proof
      queue:
        - migrations-writers
      approve:
        - migrations-writers
      reject:
        - migrations-needs-second-admin
---
# IAM policy: the ceiling. It grants entitlement and carries no approvals or proofs.
rules:
  - name: migrations-ceiling-allow
    when: true
    action: allow

applications:
  migrations:
    actions:
      read: [migrations-ceiling-allow]
      run: [migrations-ceiling-allow]
      queue: [migrations-ceiling-allow]
      approve: [migrations-ceiling-allow]
      reject: [migrations-ceiling-allow]
