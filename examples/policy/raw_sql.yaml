# Raw SQL
# Read-only raw SQL under the confined query role, and governed raw migrations.
#
# Surface:   raw_sql
# Qualifier: none (the surface has no qualifier)
# Actions:   execute, migrate
#
# This file holds two YAML documents. The first is a policy bundle: named rules
# with approvals and step-up proof, referenced from policy.raw_sql. The second is an
# IAM policy: the principal-bound ceiling, limited to `when` and `action: allow|deny`.
# The ceiling is evaluated first; the bundle can only narrow it.

rules:
  - name: raw-sql-writers
    when:
      contains: [subject.roles, "PROJECT_ADMIN"]
    action: allow

policy:
  raw_sql:
    actions:
      execute:
        - raw-sql-writers
      migrate:
        - raw-sql-writers
---
# IAM policy: the ceiling. It grants entitlement and carries no approvals or proofs.
rules:
  - name: raw-sql-ceiling-allow
    when: true
    action: allow

applications:
  raw_sql:
    actions:
      execute: [raw-sql-ceiling-allow]
      migrate: [raw-sql-ceiling-allow]
