# Event triggers
# Event-trigger create, read, update and delete.
#
# Surface:   triggers
# Qualifier: none (the surface has no qualifier)
# Actions:   create, read, update, delete
#
# This file holds two YAML documents. The first is a policy bundle: named rules
# with approvals and step-up proof, referenced from policy.triggers. The second is an
# IAM policy: the principal-bound ceiling, limited to `when` and `action: allow|deny`.
# The ceiling is evaluated first; the bundle can only narrow it.

rules:
  - name: triggers-readers
    when:
      contains: [subject.roles, "PROJECT_ADMIN"]
    action: allow
  - name: triggers-writers
    when:
      contains: [subject.roles, "PROJECT_ADMIN"]
    action: allow
  - name: triggers-needs-second-admin
    when: true
    requires_approval_from: { role: PROJECT_ADMIN }
    expires_after: P2D

policy:
  triggers:
    actions:
      create:
        - triggers-writers
      read:
        - triggers-readers
      update:
        - triggers-writers
      delete:
        - triggers-needs-second-admin
---
# IAM policy: the ceiling. It grants entitlement and carries no approvals or proofs.
rules:
  - name: triggers-ceiling-allow
    when: true
    action: allow
  - name: triggers-ceiling-from-office-network
    when:
      in_cidr: [environment.ip, ["203.0.113.0/24", "2001:db8::/32"]]
    action: allow

applications:
  triggers:
    actions:
      create: [triggers-ceiling-allow]
      read: [triggers-ceiling-allow]
      update: [triggers-ceiling-allow]
      delete: [triggers-ceiling-from-office-network]
