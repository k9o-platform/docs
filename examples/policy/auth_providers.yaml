# Identity providers
# Identity-provider configuration.
#
# Surface:   auth_providers
# Qualifier: none (the surface has no qualifier)
# Actions:   create, read, update, delete
#
# This file holds two YAML documents. The first is a policy bundle: named rules
# with approvals and step-up proof, referenced from policy.auth_providers. The second is an
# IAM policy: the principal-bound ceiling, limited to `when` and `action: allow|deny`.
# The ceiling is evaluated first; the bundle can only narrow it.

rules:
  - name: auth-providers-readers
    when:
      contains: [subject.roles, "PROJECT_ADMIN"]
    action: allow
  - name: auth-providers-writers
    when:
      contains: [subject.roles, "PROJECT_ADMIN"]
    action: allow
  - name: auth-providers-needs-second-admin
    when: true
    requires_approval_from: { role: PROJECT_ADMIN }
    expires_after: P2D

policy:
  auth_providers:
    actions:
      create:
        - auth-providers-writers
      read:
        - auth-providers-readers
      update:
        - auth-providers-writers
      delete:
        - auth-providers-needs-second-admin
---
# IAM policy: the ceiling. It grants entitlement and carries no approvals or proofs.
rules:
  - name: auth-providers-ceiling-allow
    when: true
    action: allow
  - name: auth-providers-ceiling-from-office-network
    when:
      in_cidr: [environment.ip, ["203.0.113.0/24", "2001:db8::/32"]]
    action: allow

applications:
  auth_providers:
    actions:
      create: [auth-providers-ceiling-allow]
      read: [auth-providers-ceiling-allow]
      update: [auth-providers-ceiling-allow]
      delete: [auth-providers-ceiling-from-office-network]
