# Secrets
# Creating a secret and revealing its value. A secret is addressed by its immutable id, never its path.
#
# Surface:   secrets
# Qualifier: sec_9Qw3eRt5YuLk
# Actions:   create, reveal
#
# This file holds two YAML documents. The first is a policy bundle: named rules
# with approvals and step-up proof, referenced from policy.secrets. The second is an
# IAM policy: the principal-bound ceiling, limited to `when` and `action: allow|deny`.
# The ceiling is evaluated first; the bundle can only narrow it.

rules:
  - name: secrets-writers
    when:
      or:
        - contains: [subject.roles, "PROJECT_ADMIN"]
        - contains: [subject.roles, "PROJECT_EDITOR"]
    action: allow
  - name: secrets-admin-with-fresh-proof
    when:
      contains: [subject.roles, "PROJECT_ADMIN"]
    action: allow
    requires_proof: { max_age: "5m", min_tier: T3_KEY_POSSESSION, single_use: true }

policy:
  secrets:
    actions:
      create:
        - secrets-writers
    # Every other key under secrets is a secret id.
    sec_9Qw3eRt5YuLk:
      reveal:
        - secrets-admin-with-fresh-proof
---
# IAM policy: the ceiling. It grants entitlement and carries no approvals or proofs.
rules:
  - name: secrets-ceiling-allow
    when: true
    action: allow
  - name: secrets-ceiling-from-office-network
    when:
      in_cidr: [environment.ip, ["203.0.113.0/24", "2001:db8::/32"]]
    action: allow

applications:
  secrets:
    actions:
      create: [secrets-ceiling-allow]
    "*":
      reveal: [secrets-ceiling-from-office-network]
