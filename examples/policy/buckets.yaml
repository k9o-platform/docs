# Storage buckets
# Object operations in a bucket (read, upload, delete, list) and the bucket lifecycle (create, update, remove).
#
# Surface:   buckets
# Qualifier: avatars
# Actions:   read, upload, delete, list, create, update, remove
#
# This file holds two YAML documents. The first is a policy bundle: inline rules
# under policy.buckets. The second is an
# IAM policy: the principal-bound ceiling, limited to `when` and `action: allow|deny`.
# The ceiling is evaluated first; the bundle can only narrow it.
# The policy bundle and the IAM policy use the same key, buckets.

policy:
  buckets:
    avatars:
      actions:
        read:
          rule:
            eq: [subject.id, resource.metadata.userId]
        upload:
          rule:
            contains: [subject.roles, "PROJECT_MEMBER"]
        delete:
          rule:
            contains: [subject.roles, "PROJECT_ADMIN"]
        list:
          rule:
            contains: [subject.roles, "PROJECT_MEMBER"]
        # Bucket lifecycle: the bucket itself, not its objects.
        create:
          rule:
            contains: [subject.roles, "PROJECT_ADMIN"]
        update:
          rule:
            contains: [subject.roles, "PROJECT_ADMIN"]
        remove:
          rule:
            contains: [subject.roles, "PROJECT_ADMIN"]
---
# IAM policy: the ceiling. It grants entitlement and carries no approvals or proofs.
rules:
  - name: buckets-ceiling-allow
    when: true
    action: allow
  - name: buckets-ceiling-from-office-network
    when:
      in_cidr: [environment.ip, ["203.0.113.0/24", "2001:db8::/32"]]
    action: allow

applications:
  buckets:
    avatars:
      actions:
        read: [buckets-ceiling-allow]
        upload: [buckets-ceiling-allow]
        delete: [buckets-ceiling-from-office-network]
        list: [buckets-ceiling-allow]
        create: [buckets-ceiling-allow]
        update: [buckets-ceiling-allow]
        remove: [buckets-ceiling-from-office-network]
