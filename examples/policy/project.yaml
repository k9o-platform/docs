# Project administration
# Project delete, restore, update and residency-region changes.
#
# Surface:   project
# Qualifier: none (the surface has no qualifier)
# Actions:   delete, restore, update, add_region, remove_region
#
# This file holds two YAML documents. The first is a policy bundle: named rules
# with approvals and step-up proof, referenced from policy.project. The second is an
# IAM policy: the principal-bound ceiling, limited to `when` and `action: allow|deny`.
# The ceiling is evaluated first; the bundle can only narrow it.

rules:
  - name: project-admins
    when:
      contains: [subject.roles, "PROJECT_ADMIN"]
    action: allow
  - name: project-admin-with-fresh-proof
    when:
      contains: [subject.roles, "PROJECT_ADMIN"]
    action: allow
    requires_proof: { max_age: "5m", min_tier: T3_KEY_POSSESSION, single_use: true }
  - name: project-needs-second-admin
    when: true
    requires_approval_from: { role: PROJECT_ADMIN }
    expires_after: P2D

policy:
  project:
    actions:
      delete:
        - project-needs-second-admin
      restore:
        - project-admin-with-fresh-proof
      update:
        - project-admins
      add_region:
        - project-admin-with-fresh-proof
      remove_region:
        - project-needs-second-admin
---
# IAM policy: the ceiling. It grants entitlement and carries no approvals or proofs.
rules:
  - name: project-ceiling-allow
    when: true
    action: allow
  - name: project-ceiling-from-office-network
    when:
      in_cidr: [environment.ip, ["203.0.113.0/24", "2001:db8::/32"]]
    action: allow

applications:
  project:
    actions:
      delete: [project-ceiling-from-office-network]
      restore: [project-ceiling-allow]
      update: [project-ceiling-allow]
      add_region: [project-ceiling-allow]
      remove_region: [project-ceiling-allow]
