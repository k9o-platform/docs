# Studio queries
# Saved Studio (data explorer) query authoring.
#
# Surface:   studio_queries
# Qualifier: stq_2Xy7zAb4CdMf
# Actions:   create, read, update, delete
#
# This file holds two YAML documents. The first is a policy bundle: named rules
# with approvals and step-up proof, referenced from policy.studio_queries. The second is an
# IAM policy: the principal-bound ceiling, limited to `when` and `action: allow|deny`.
# The ceiling is evaluated first; the bundle can only narrow it.

rules:
  - name: studio-queries-readers
    when:
      or:
        - contains: [subject.roles, "PROJECT_ADMIN"]
        - contains: [subject.roles, "PROJECT_MEMBER"]
        - contains: [subject.roles, "PROJECT_VIEWER"]
    action: allow
  - name: studio-queries-writers
    when:
      or:
        - contains: [subject.roles, "PROJECT_ADMIN"]
        - contains: [subject.roles, "PROJECT_AUTHOR"]
    action: allow
  - name: studio-queries-needs-second-admin
    when: true
    requires_approval_from: { role: PROJECT_ADMIN }
    expires_after: P2D

policy:
  studio_queries:
    stq_2Xy7zAb4CdMf:
      actions:
        create:
          - studio-queries-writers
        read:
          - studio-queries-readers
        update:
          - studio-queries-writers
        delete:
          - studio-queries-needs-second-admin
---
# IAM policy: the ceiling. It grants entitlement and carries no approvals or proofs.
rules:
  - name: studio-queries-ceiling-allow
    when: true
    action: allow
  - name: studio-queries-ceiling-from-office-network
    when:
      in_cidr: [environment.ip, ["203.0.113.0/24", "2001:db8::/32"]]
    action: allow

applications:
  studio_queries:
    stq_2Xy7zAb4CdMf:
      actions:
        create: [studio-queries-ceiling-allow]
        read: [studio-queries-ceiling-allow]
        update: [studio-queries-ceiling-allow]
        delete: [studio-queries-ceiling-from-office-network]
