# Sign-in flows
# Sign-in flow authoring.
#
# Surface:   auth_flows
# Qualifier: flow_3Pq8rSt2VwHd
# Actions:   create, read, update, delete
#
# This file holds two YAML documents. The first is a policy bundle: named rules
# with approvals and step-up proof, referenced from policy.auth_flows. The second is an
# IAM policy: the principal-bound ceiling, limited to `when` and `action: allow|deny`.
# The ceiling is evaluated first; the bundle can only narrow it.

rules:
  - name: auth-flows-readers
    when:
      contains: [subject.roles, "PROJECT_ADMIN"]
    action: allow
  - name: auth-flows-writers
    when:
      contains: [subject.roles, "PROJECT_ADMIN"]
    action: allow
  - name: auth-flows-needs-second-admin
    when: true
    requires_approval_from: { role: PROJECT_ADMIN }
    expires_after: P2D

policy:
  auth_flows:
    flow_3Pq8rSt2VwHd:
      actions:
        create:
          - auth-flows-writers
        read:
          - auth-flows-readers
        update:
          - auth-flows-writers
        delete:
          - auth-flows-needs-second-admin
---
# IAM policy: the ceiling. It grants entitlement and carries no approvals or proofs.
rules:
  - name: auth-flows-ceiling-allow
    when: true
    action: allow
  - name: auth-flows-ceiling-from-office-network
    when:
      in_cidr: [environment.ip, ["203.0.113.0/24", "2001:db8::/32"]]
    action: allow

applications:
  auth_flows:
    flow_3Pq8rSt2VwHd:
      actions:
        create: [auth-flows-ceiling-allow]
        read: [auth-flows-ceiling-allow]
        update: [auth-flows-ceiling-allow]
        delete: [auth-flows-ceiling-from-office-network]
