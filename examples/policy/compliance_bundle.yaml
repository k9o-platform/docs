# Compliance bundle
# Exporting the signed compliance-attestation bundle.
#
# Surface:   compliance_bundle
# Qualifier: none (the surface has no qualifier)
# Actions:   export
#
# This file holds two YAML documents. The first is a policy bundle: named rules
# with approvals and step-up proof, referenced from policy.compliance_bundle. The second is an
# IAM policy: the principal-bound ceiling, limited to `when` and `action: allow|deny`.
# The ceiling is evaluated first; the bundle can only narrow it.

rules:
  - name: compliance-bundle-admin-with-fresh-proof
    when:
      contains: [subject.roles, "PROJECT_ADMIN"]
    action: allow
    requires_proof: { max_age: "5m", min_tier: T3_KEY_POSSESSION, single_use: true }

policy:
  compliance_bundle:
    actions:
      export:
        - compliance-bundle-admin-with-fresh-proof
---
# IAM policy: the ceiling. It grants entitlement and carries no approvals or proofs.
rules:
  - name: compliance-bundle-ceiling-allow
    when: true
    action: allow

applications:
  compliance_bundle:
    actions:
      export: [compliance-bundle-ceiling-allow]
