# Application crypto
# Encrypt, decrypt and rewrap through the API.
#
# Surface:   crypto
# Qualifier: card-data
# Actions:   encrypt, decrypt, rewrap
#
# This file holds two YAML documents. The first is a policy bundle: named rules
# with approvals and step-up proof, referenced from policy.crypto. The second is an
# IAM policy: the principal-bound ceiling, limited to `when` and `action: allow|deny`.
# The ceiling is evaluated first; the bundle can only narrow it.

rules:
  - name: crypto-writers
    when:
      or:
        - contains: [subject.roles, "PROJECT_ADMIN"]
        - contains: [subject.roles, "PROJECT_EDITOR"]
    action: allow
  - name: crypto-admin-with-fresh-proof
    when:
      contains: [subject.roles, "PROJECT_ADMIN"]
    action: allow
    requires_proof: { max_age: "5m", min_tier: T3_KEY_POSSESSION, single_use: true }

policy:
  crypto:
    card-data:
      actions:
        encrypt:
          - crypto-writers
        decrypt:
          - crypto-admin-with-fresh-proof
        rewrap:
          - crypto-admin-with-fresh-proof
---
# IAM policy: the ceiling. It grants entitlement and carries no approvals or proofs.
rules:
  - name: crypto-ceiling-allow
    when: true
    action: allow
  - name: crypto-ceiling-from-office-network
    when:
      in_cidr: [environment.ip, ["203.0.113.0/24", "2001:db8::/32"]]
    action: allow

applications:
  crypto:
    card-data:
      actions:
        encrypt: [crypto-ceiling-allow]
        decrypt: [crypto-ceiling-from-office-network]
        rewrap: [crypto-ceiling-allow]
