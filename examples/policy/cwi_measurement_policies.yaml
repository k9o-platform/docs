# Workload measurement policies
# Measurement allowlists for confidential workload identities.
#
# Surface:   cwi_measurement_policies
# Qualifier: cwip_2Lm6bVc8XzPq
# Actions:   create, read, widen, narrow, delete
#
# This file holds two YAML documents. The first is a policy bundle: named rules
# with approvals and step-up proof, referenced from policy.cwi_measurement_policies. The second is an
# IAM policy: the principal-bound ceiling, limited to `when` and `action: allow|deny`.
# The ceiling is evaluated first; the bundle can only narrow it.

rules:
  - name: cwi-measurement-policies-readers
    when:
      contains: [subject.roles, "PROJECT_ADMIN"]
    action: allow
  - name: cwi-measurement-policies-writers
    when:
      contains: [subject.roles, "PROJECT_ADMIN"]
    action: allow
  - name: cwi-measurement-policies-admins
    when:
      contains: [subject.roles, "PROJECT_ADMIN"]
    action: allow
  - name: cwi-measurement-policies-needs-second-admin
    when: true
    requires_approval_from: { role: PROJECT_ADMIN }
    expires_after: P2D

policy:
  cwi_measurement_policies:
    cwip_2Lm6bVc8XzPq:
      actions:
        create:
          - cwi-measurement-policies-writers
        read:
          - cwi-measurement-policies-readers
        widen:
          - cwi-measurement-policies-needs-second-admin
        narrow:
          - cwi-measurement-policies-admins
        delete:
          - cwi-measurement-policies-admins
---
# IAM policy: the ceiling. It grants entitlement and carries no approvals or proofs.
rules:
  - name: cwi-measurement-policies-ceiling-allow
    when: true
    action: allow
  - name: cwi-measurement-policies-ceiling-from-office-network
    when:
      in_cidr: [environment.ip, ["203.0.113.0/24", "2001:db8::/32"]]
    action: allow

applications:
  cwi_measurement_policies:
    cwip_2Lm6bVc8XzPq:
      actions:
        create: [cwi-measurement-policies-ceiling-allow]
        read: [cwi-measurement-policies-ceiling-allow]
        widen: [cwi-measurement-policies-ceiling-allow]
        narrow: [cwi-measurement-policies-ceiling-allow]
        delete: [cwi-measurement-policies-ceiling-from-office-network]
