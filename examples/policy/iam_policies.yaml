# IAM policies
# Creating, editing and widening IAM policies.
#
# Surface:   iam_policies
# Qualifier: iam_8Zx4cVb1NmRt
# Actions:   create, read, update, delete, widen
#
# This file holds two YAML documents. The first is a policy bundle: named rules
# with approvals and step-up proof, referenced from policy.iam_policies. The second is an
# IAM policy: the principal-bound ceiling, limited to `when` and `action: allow|deny`.
# The ceiling is evaluated first; the bundle can only narrow it.

rules:
  - name: iam-policies-readers
    when:
      contains: [subject.roles, "PROJECT_ADMIN"]
    action: allow
  - name: iam-policies-writers
    when:
      contains: [subject.roles, "PROJECT_ADMIN"]
    action: allow
  - name: iam-policies-needs-second-admin
    when: true
    requires_approval_from: { role: PROJECT_ADMIN }
    expires_after: P2D

policy:
  iam_policies:
    iam_8Zx4cVb1NmRt:
      actions:
        create:
          - iam-policies-writers
        read:
          - iam-policies-readers
        update:
          - iam-policies-writers
        delete:
          - iam-policies-needs-second-admin
        widen:
          - iam-policies-needs-second-admin
---
# IAM policy: the ceiling. It grants entitlement and carries no approvals or proofs.
rules:
  - name: iam-policies-ceiling-allow
    when: true
    action: allow
  - name: iam-policies-ceiling-from-office-network
    when:
      in_cidr: [environment.ip, ["203.0.113.0/24", "2001:db8::/32"]]
    action: allow

applications:
  iam_policies:
    iam_8Zx4cVb1NmRt:
      actions:
        create: [iam-policies-ceiling-allow]
        read: [iam-policies-ceiling-allow]
        update: [iam-policies-ceiling-allow]
        delete: [iam-policies-ceiling-from-office-network]
        widen: [iam-policies-ceiling-allow]
