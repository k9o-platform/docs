<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 566" width="1200" height="566" role="img" aria-labelledby="t d">
  <title id="t">Choose a subscription</title>
  <desc id="d">A decision diagram. Ask what you want to listen to. Application events use streams. Collection changes and other live topics use realtime.subscribe. A declared metadata surface uses metadata.subscribe. The cells of a rollup use rollups.subscribe. The project&#x27;s audit history uses audit.tail.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8fb0ff"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ffffff"/></marker>
  </defs>
  <rect x="0" y="0" width="1200" height="566" rx="16" fill="#0d1116"/>
  <g font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
