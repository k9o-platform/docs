    <rect x="370" y="64" width="440" height="100" rx="6" fill="#0b1b35" stroke="#3a5890" stroke-width="2"/>
    <text x="590.0" y="105" font-size="24" font-weight="400" fill="#b8cbf2" text-anchor="middle">Publish and replay</text>
    <text x="590.0" y="141" font-size="24" fill="#9db6e8" text-anchor="middle">application events</text>
    <path d="M812 114 H858" fill="none" stroke="#8fb0ff" stroke-width="2.5" marker-end="url(#ah)"/>
    <rect x="860" y="64" width="320" height="100" rx="6" fill="#10264a" stroke="#4f7cff" stroke-width="2"/>
    <text x="1020.0" y="123" font-size="24" font-weight="700" fill="#eaf1ff" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">streams</text>
    <path d="M335 358 V236 H368" fill="none" stroke="#8fb0ff" stroke-width="2.5" marker-end="url(#ah)"/>
    <rect x="370" y="186" width="440" height="100" rx="6" fill="#0b1b35" stroke="#3a5890" stroke-width="2"/>
    <text x="590.0" y="227" font-size="24" font-weight="400" fill="#b8cbf2" text-anchor="middle">Follow changes to a collection,</text>
    <text x="590.0" y="263" font-size="24" fill="#9db6e8" text-anchor="middle">and other live topics</text>
    <path d="M812 236 H858" fill="none" stroke="#8fb0ff" stroke-width="2.5" marker-end="url(#ah)"/>
    <rect x="860" y="186" width="320" height="100" rx="6" fill="#10264a" stroke="#4f7cff" stroke-width="2"/>
    <text x="1020.0" y="245" font-size="24" font-weight="700" fill="#eaf1ff" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">realtime.subscribe</text>
    <path d="M335 358 H368" fill="none" stroke="#8fb0ff" stroke-width="2.5" marker-end="url(#ah)"/>
    <rect x="370" y="308" width="440" height="100" rx="6" fill="#0b1b35" stroke="#3a5890" stroke-width="2"/>
    <text x="590.0" y="349" font-size="24" font-weight="400" fill="#b8cbf2" text-anchor="middle">Follow changes to a declared</text>
    <text x="590.0" y="385" font-size="24" fill="#9db6e8" text-anchor="middle">metadata surface</text>
    <path d="M812 358 H858" fill="none" stroke="#8fb0ff" stroke-width="2.5" marker-end="url(#ah)"/>
    <rect x="860" y="308" width="320" height="100" rx="6" fill="#10264a" stroke="#4f7cff" stroke-width="2"/>
    <text x="1020.0" y="367" font-size="24" font-weight="700" fill="#eaf1ff" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">metadata.subscribe</text>
    <path d="M335 358 V480 H368" fill="none" stroke="#8fb0ff" stroke-width="2.5" marker-end="url(#ah)"/>
    <rect x="370" y="430" width="440" height="100" rx="6" fill="#0b1b35" stroke="#3a5890" stroke-width="2"/>
    <text x="590.0" y="471" font-size="24" font-weight="400" fill="#b8cbf2" text-anchor="middle">Follow the cells</text>
    <text x="590.0" y="507" font-size="24" fill="#9db6e8" text-anchor="middle">of a rollup</text>
