    <rect x="860" y="552" width="320" height="100" rx="6" fill="#10264a" stroke="#4f7cff" stroke-width="2"/>
    <text x="1020.0" y="611" font-size="24" font-weight="700" fill="#eaf1ff" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">audit.tail</text>
    <path d="M322 358 H335" fill="none" stroke="#8fb0ff" stroke-width="2.5"/>
    </g>
