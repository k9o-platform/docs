    <rect x="860" y="430" width="320" height="100" rx="6" fill="#10264a" stroke="#4f7cff" stroke-width="2"/>
    <text x="1020.0" y="489" font-size="24" font-weight="700" fill="#eaf1ff" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace">rollups.subscribe</text>
    <path d="M335 358 V602 H368" fill="none" stroke="#8fb0ff" stroke-width="2.5" marker-end="url(#ah)"/>
    <rect x="370" y="552" width="440" height="100" rx="6" fill="#0b1b35" stroke="#3a5890" stroke-width="2"/>
    <text x="590.0" y="593" font-size="24" font-weight="400" fill="#b8cbf2" text-anchor="middle">Follow the project&#x27;s</text>
    <text x="590.0" y="629" font-size="24" fill="#9db6e8" text-anchor="middle">audit history</text>
