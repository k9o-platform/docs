<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 576" role="img" aria-labelledby="hub-ext-t hub-ext-d">
  <title id="hub-ext-t">Architecture at a glance</title>
  <desc id="hub-ext-d">Ingress and egress of an extension. Steps 1 to 7. Invoke calls enter at Ingress (1) and reach an extension (2) that runs in a Firelock sandbox on Bun or Wasmtime. The sandbox has no network of its own: all guest egress goes through one auditable vsock channel to the Decision Oracle (3), Warden, which evaluates each call and escalates to a human reviewer (4) when needed. External agents can also submit tool calls through the platform's MCP interface, where the Decision Oracle applies the same governance framework. Allowed calls go to the Credentials Oracle (5), which brokers all credentials with Kibo (6), so the extension never holds credentials. Calls leave through Egress (7), only to allow-listed endpoints.</desc>
